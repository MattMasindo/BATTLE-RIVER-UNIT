<style>
  /* ---- Typography: one cross-platform system stack ---------------------
     --font-ui is the stack specified for the app. --font-mono keeps the
     tabular/eyebrow text monospaced using whatever mono face the OS
     already ships, so number columns and tracked-out labels still line
     up without downloading a font. */
  :root {
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo,
                 Consolas, "Liberation Mono", monospace;
  }
  body { font-family: var(--font-ui); background: #0F131B; -webkit-tap-highlight-color: transparent; }
  /* Space Grotesk was only loaded at 500+, so headings never rendered at
     400. Pinning 600 here keeps the same heading weight now that the
     family is the system UI face, which does ship a 400. */
  .font-display { font-family: var(--font-ui); font-weight: 600; letter-spacing: -0.01em; }
  .font-mono { font-family: var(--font-mono); }
 
  /* ---- Top-of-screen safe area ----------------------------------------
     The header background still runs edge to edge and up under the status
     bar; only its CONTENT is pushed clear of the inset. env() resolves to
     0px wherever there is no inset (Android, tablet, desktop, and iPhones
     without a notch), so this is a plain 16px of breathing room there and
     grows to clear the Dynamic Island on an iPhone 15 Pro Max — no device
     detection, no breakpoints. Requires viewport-fit=cover, which the
     viewport meta above already sets. */
  .safe-top { padding-top: calc(env(safe-area-inset-top) + 16px); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .pop { animation: pop 0.4s ease; }
 
  /* Toast used by the script half. */
  @keyframes flash { 0% { opacity: 0; transform: translateY(6px); } 15% { opacity: 1; transform: translateY(0); } 85% { opacity: 1; } 100% { opacity: 0; } }
  .flash { animation: flash 1.6s ease forwards; }
 
  /* ---- Rule 7: zero-blank-screen. Skeletons, spinners, progress bars. --- */
  @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .skel {
    background: linear-gradient(90deg, #1B2231 0%, #263049 42%, #1B2231 84%);
    background-size: 420px 100%;
    animation: shimmer 1.25s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes indeterminate { 0% { left: -35%; width: 35%; } 60% { left: 100%; width: 35%; } 100% { left: 100%; width: 35%; } }
  .bar-indeterminate { position: absolute; top: 0; bottom: 0; border-radius: 999px; animation: indeterminate 1.15s ease-in-out infinite; }
 
  /* ---- Rule 14: bottom sheet ------------------------------------------- */
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet-in { animation: sheetIn 0.24s cubic-bezier(0.32, 0.72, 0, 1); }
  .fade-in { animation: fadeIn 0.18s ease; }
  .sheet-grab { touch-action: none; }
 
  /* Bottom tab bar is fixed, so every scrollable page reserves room for it. */
  .has-bottom-nav { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }

  /* ---- Patch 6: the close celebration ----------------------------------
     Reaching "done" is the single best thing that happens in this app and
     it used to be a paragraph of text telling the advisor to go and do
     data entry. `rise` brings the card up under its own weight; `sparkle`
     drives the ring behind the seal. Both are listed in the
     prefers-reduced-motion block below with everything else. */
  @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .rise { animation: rise 0.42s cubic-bezier(0.22, 1, 0.36, 1) both; }
  @keyframes sparkle { 0% { transform: scale(0.6); opacity: 0; } 45% { opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }
  .sparkle { animation: sparkle 1.5s ease-out infinite; }
 
  @media (prefers-reduced-motion: reduce) {
    .skel, .spin, .bar-indeterminate, .sheet-in, .fade-in, .pop, .flash,
    .rise, .sparkle { animation: none !important; }
  }
</style>

<script>
(function () {
"use strict";
 
// =====================================================================
// BATTLE RIVER UNIT — one app.
//
// This file is the merge of two previously separate single-file apps:
// the Activity Dashboard (v4.0) and the Chat Selling Script Tool
// (v1.5.0-patch5-ux). Both already talked to the same Supabase project,
// the same `advisors` roster, the same `verify_advisor_pin` RPC and the
// same manager-approval gate — they were two front doors onto one
// system. This is that system with one front door.
//
// What the merge actually had to reconcile (each of these existed twice,
// with DIFFERENT behaviour, and could not simply be concatenated):
//   * lget/lset          — two signatures (fallback vs no fallback)
//   * daysSince          — ms-delta (script) vs ISO-string (dashboard)
//   * scrollToTop        — two implementations
//   * logEvent           — identical but for the client variable name
//   * verifyAdvisorPin   — two copies of the same RPC wrapper
//   * routing + history  — two independent routers and back stacks
//   * bottom navigation  — two independent tab bars
//   * scroll retention   — two independent implementations
//   * identity           — `my-identity` (dashboard) vs `br-advisor`
//                          (script), the same roster row stored twice
//
// Everything below this preamble is the SINGLE canonical version of each
// of those. The screens themselves — the 26-step script flow, the award
// tracks, the payout maths, the leaderboards — are carried over
// unchanged; none of the business logic was rewritten by this merge.
// =====================================================================
 
var h = React.createElement;
var useState = React.useState,
    useEffect = React.useEffect,
    useMemo = React.useMemo,
    useRef = React.useRef,
    useLayoutEffect = React.useLayoutEffect;
 
// --- One Supabase client for the whole app -------------------------------
// Both halves of the codebase reference it by their own historical name,
// so `supabaseClient` is kept as an alias rather than renaming ~40 call
// sites in the script layer. Same object, one connection.
var SUPABASE_URL = window.SUPABASE_URL;
var SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY;
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
var supabaseClient = sb;
 
// --- One palette ---------------------------------------------------------
// The Dashboard's slate/brass is now the whole app's palette. The script
// layer keeps addressing colours through its own `C` token names (52
// references to C.muted alone), so `C` is re-pointed at COLORS instead of
// rewriting every style object — the script screens re-theme wholesale
// and stay diffable against their pre-merge source.
var COLORS = {
  ink: "#EDEFF5", inkLight: "#2DD4BF", parchment: "#0F131B", card: "#171D29",
  brass: "#F2B705", brassLight: "#F7CB55", slate: "#8891A6", rust: "#E24B4A",
  line: "#2A3244", good: "#2DD4BF", emphasis: "#FF6A3D"
};
 
// SVG text and a couple of inline styles can't use the .font-mono class,
// so they read the same system monospace stack from here. Kept in sync
// with --font-mono in the stylesheet by hand — there are only two callers.
var MONO_STACK = 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace';
 
var C = {
  bg: COLORS.parchment,
  surface: COLORS.card,
  surfaceAlt: "#202839",
  gold: COLORS.brass,
  goldSoft: COLORS.brassLight,
  goldDim: "#5A4708",
  text: COLORS.ink,
  muted: COLORS.slate,
  line: COLORS.line,
  good: COLORS.good
};
 
// --- One localStorage layer ----------------------------------------------
// The script layer calls lget(key, fallback); the dashboard layer calls
// lget(key) and expects null. This is the strict superset of both: an
// explicit fallback is honoured, an omitted one resolves to null exactly
// as the dashboard's original did.
function lget(k, fallback) {
  if (fallback === undefined) fallback = null;
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch (e) { return fallback; }
}
function lset(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
 
 
// ===================== DASHBOARD HALF =====================
// Carried over unchanged from the Activity Dashboard: activity
// logging, leaderboards, lanes, awards, referrals, submissions,
// recruitment, the manager side, and the UX kit (skeletons,
// spinners, bottom sheets, incremental paging, scroll memory).
 
var METRICS = [
  { key: "prospecting", label: "New Prospects", short: "Prospecting", color: COLORS.slate, auto: true },
  { key: "approaching", label: "Chat Script Usage", short: "Script Usage", color: COLORS.brassLight, auto: true },
  { key: "appts", label: "Appointments Set", short: "Appointments", color: COLORS.brass },
  { key: "presented", label: "Clients Presented", short: "Presented", color: COLORS.ink },
  { key: "closed", label: "Clients Closed", short: "Closed", color: COLORS.rust }
];
 
function localDateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
 
function todayStr(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  return localDateStr(d);
}
 
function startOfWeek(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();

// calculations once did. One definition, two callers.

// The manager passes a byDate map built from teamEntries; the advisor
// passes myEntries, which is already keyed by entry_date. Same shape,
// same arithmetic, same answer.

// One cell per calendar day, oldest -> today. Weekends are flagged (not

// currentStreakFrom/bestStreakFrom elsewhere in this file.

// the tool didn't exist for them yet — so they must not be counted in the
// denominator or drawn the same colour as a missed day.
//
// Takes the EARLIEST of (roster started_on, roster created_at, first entry)
// deliberately. Using first-entry alone would let someone who joined three
// weeks ago and logged once yesterday score 1/1 = perfect, which is a worse
// lie than the fixed-22 denominator this replaces. created_at is parsed
// through localDateStr so a UTC timestamp lands on the right Manila day.

  var candidates = [];
  if (r && r.started_on) candidates.push(String(r.started_on).slice(0, 10));
  if (r && r.created_at) {
    var parsed = new Date(r.created_at);
    if (!isNaN(parsed.getTime())) candidates.push(localDateStr(parsed));
  }
  var firstEntry = null;
  Object.keys(byDate || {}).forEach(function (d) {

    var e = byDate[day.date];
    var lit = entryTotal(e) > 0;
    var full = isFullFunnel(e);
    if (!day.weekend && !preTenure) {
      eligibleWeekdays++;
      if (lit) loggedWeekdays++;
    }
    return { date: day.date, weekend: day.weekend, lit: lit, full: full, preTenure: preTenure };
  });
  return {
    cells: cells,
    loggedWeekdays: loggedWeekdays,
    eligibleWeekdays: eligibleWeekdays,
    startStr: startStr,
    // "New" until they've had a fair chance at a two-week run. Below this,
    // a percentage is too noisy to compare against a veteran's.
    isNew: eligibleWeekdays > 0 && eligibleWeekdays < 10

    var key = (track === SCRIPT_HEALTH ? "h_c_" : "c_") + slug;
    if (steps[key]) { flashMsg("A step called " + key + " already exists.", false); return; }
    var next = JSON.parse(JSON.stringify(draft));
    next.custom = next.custom || {};
    next.custom[key] = {
      stage: "prospect",
      title: newTitle.trim() || slug.replace(/_/g, " "),
      note: "",
      scripts: [],
      choices: [{ label: "Back to the opener", next: scriptStartStep(track) }],

    setBusy("");
  }

  async function publish() {
    if (!check.ok) { flashMsg("Fix the errors first.", false); return; }
    setBusy("publish");
    try {
      var pin = await props.requirePin();
      var res = await sb.rpc("admin_publish_script", { p_actor_id: props.actorId, p_pin: pin, p_doc: draft, p_note: null });
      if (res.error || !(res.data && res.data.ok)) {
        var serverErrors = res.data && res.data.errors;
        if (serverErrors && serverErrors.length) flashMsg(serverErrors[0], false);
        else flashMsg(managerGateMessage(res.data && res.data.error, res.data), false);
      } else {
        setPublished(JSON.parse(JSON.stringify(draft)));
        setPubVersion(res.data.version || 0);
        applyScriptDoc(draft, res.data.version || 0);
        lset(SCRIPT_DOC_KEY, { doc: draft, version: res.data.version || 0 });
        if (props.onPublished) props.onPublished();
        flashMsg("Published as v" + (res.data.version || 0) + ". Advisors get it next time they open the app.");

    setBusy("");

function TrendChart(props) {
  var data = props.data;
  var w = 320, ht = 160, pad = 24;
  var max = Math.max.apply(null, [1].concat(data.reduce(function (acc, d) { return acc.concat(METRICS.map(function (m) { return d[m.key] || 0; })); }, [])));
  var x = function (i) { return pad + (i * (w - pad * 2)) / (data.length - 1); };
  var y = function (v) { return ht - pad - (v / max) * (ht - pad * 2); };
  return h("svg", { viewBox: "0 0 " + w + " " + ht, className: "w-full" },
    METRICS.map(function (m) {
      return h("polyline", {
        key: m.key, fill: "none", stroke: m.color, strokeWidth: "2",
        points: data.map(function (d, i) { return x(i) + "," + y(d[m.key] || 0); }).join(" ")
      });
    }),
    data.map(function (d, i) {
      return h("text", { key: d.date, x: x(i), y: ht - 4, fontSize: "9", fill: COLORS.slate, textAnchor: "middle", fontFamily: MONO_STACK }, d.label);
    })
  );
}

// PATCH 8 — Coaching Card.
//
// Patch 7 built this around a death-step histogram: count where removed
// conversations were sitting, name that step as the skill gap. Nine days
// of real data killed that design. Three removals total, two of them the
// manager's own test conversations — one genuine removal against 143 step
// advances. The team does not declare conversations dead. They let them
// sit in the queue, so there is no death event to count.
//
// The same 143 advances each carry a from/to pair that nothing read. That
// IS the funnel: every branch in the script where a conversation either
// progresses or falls into a chase step is a measurable gate. It works at
// today's volume, needs no new instrumentation, and names a skill rather
// than a person — which was the point of the card in the first place.
//
// The copy-to-advance ratio survives but is no longer a judgement. The
// step-level data showed copy rates of 0.75 on chase steps against 0.32
// on main-line steps — same clipboard, same phones. Advisors paste when
// re-engaging someone who went quiet and type when they are mid-
// conversation, which is the tool working correctly. So the number
// measures how much of the wording was borrowed, nothing more.
//
// Sources: usage_events for gates and copy counts (via get_coaching_stats,
// SECURITY DEFINER so the anon key never needs SELECT on it),
// conversation_backups for the live board census.
// =====================================================================

// A gate needs this many resolved outcomes before a percentage is shown.
// Below it the raw counts still render — hiding them would be worse — but
// without a rate, because 1-of-2 is not 50%.
var COACH_MIN_GATE_N = 8;

// Reliance needs this many script events before it says anything at all.
var COACH_MIN_ADVISOR_EVENTS = 20;

// Funnel order is the script's own order, not count order. A funnel sorted
// by size is not a funnel.
var COACH_STAGE_ORDER = ["approach", "relationship", "prospect", "appointment", "presented", "closing"];

// Every branch in the 26-step script where a conversation either moves on
// or falls into a chase/dead step. `won` and `lost` are the actual step
// keys from STEPS — if the script gains a branch, this is the one place to
// add it. Anything else out of a gate step (a restart, say) lands in
// `other` and is kept out of the denominator rather than depressing it.
var COACH_GATES = [
  { key: "start", label: "Opener got a reply",
    won: ["explain_payout", "has_plan"], lost: ["seen_opener"],
    ask: "What is landing in the first message, and what is not?" },
  { key: "ask_details", label: "Name and birthday sent",
    won: ["got_details"], lost: ["chase_details"],
    ask: "How is the ask being framed?" },
  { key: "appt_day", label: "Meeting day chosen",
    won: ["appt_weekday", "appt_weekend"], lost: ["chase_appt"],
    ask: "Are two options being offered, or a yes/no question?" },
  { key: "benefit_payout", label: "Presentation answered",
    won: ["forms", "questions"], lost: ["chase_present"],
    ask: "Is the quotation landing, or going quiet?" },
  { key: "forms", label: "Forms and ID returned",
    won: ["close_bank"], lost: ["chase_forms"],
    ask: "Is the form being made easy enough to finish?" }

  var st = STEPS[key];
  if (st) return st.title;

}

function coachStepColor(key) {

function coachRatio(copied, advanced) {

// effort, volume or honesty, because the data does not support one: the
// hardest-working advisor on this team sits mid-range and the lowest
// number belongs to someone writing in their own voice, which is fine.
function coachRelianceBand(ratio) {
  if (ratio == null) return { key: "none", label: "no step advances yet" };
  if (ratio >= 0.7) return { key: "high", label: "mostly sending the written lines" };
  if (ratio >= 0.35) return { key: "mixed", label: "mixing the script with their own words" };
  return { key: "low", label: "mostly writing their own words" };
}

function coachTopN(list, n) {
  return (list || []).slice().sort(function (a, b) {
    if (b.n !== a.n) return b.n - a.n;
    return a.step < b.step ? -1 : 1;

// Rolls the raw transition list into one row per gate. `reached` is the
// count of resolved outcomes (won + lost) — deliberately NOT including
// `other`, so a restart cannot make a gate look worse than it was.
function coachGateStats(transitions) {
  var byFrom = {};

    var f = t.from, to = t.to;
    if (!f || !to) return;
    if (!byFrom[f]) byFrom[f] = {};

    var outs = byFrom[g.key] || {};
    var won = 0, lost = 0, other = 0;
    Object.keys(outs).forEach(function (to) {
      var n = outs[to];
      if (g.won.indexOf(to) !== -1) won += n;
      else if (g.lost.indexOf(to) !== -1) lost += n;
      else other += n;

// ---------------------------------------------------------------------
// RULE 15 — deep linking, for the whole app rather than half of it.
//
// Before the merge there were two routers: the Dashboard's
// ?view=&advisor=&sheet=&lane=&q= and the Script Tool's ?convo=/
// ?prospect=/?tab=/?view=overdue. They ran in the same browser tab in
// two different apps and knew nothing about each other.
//
// This is one router over the union of both. Every destination in either
// half is now reachable, and shareable, from a single URL space:
//
//   ?view=chats&convo=<id>        an open conversation
//   ?view=names&prospect=<id>     the Names list, that card highlighted
//   ?view=today                   today's activity logging
//   ?view=team | rewards | more
//   ?view=manager&advisor=136662  a specific advisor, manager side
//   ?view=manager&sheet=export
//
// Every link the Script Tool ever emitted still resolves. The daily
// OneSignal digest sends ?view=overdue and home-screen shortcuts send
// ?tab= and ?convo= — those are translated here rather than broken, so
// notifications already in the wild keep landing on the right entity
// instead of dumping the advisor on a generic home screen.
//
// The hash form (#?view=...) is read as a fallback because some chat
// clients strip query strings from shared links but keep the fragment.
// ---------------------------------------------------------------------
var VIEW_KEYS = ["chats", "names", "today", "team", "rewards", "more", "manager", "recruitment", "scriptedit"];
var ROUTE_KEYS = ["view", "advisor", "sheet", "lane", "q", "convo", "prospect", "focus"];
 
function parseRoute() {
  var out = { view: null, advisor: null, sheet: null, lane: null, q: null, convo: null, prospect: null, focus: null };
  try {
    var qs = window.location.search || "";
    if (qs.length < 2 && (window.location.hash || "").indexOf("?") !== -1) {
      qs = window.location.hash.slice(window.location.hash.indexOf("?"));
    }
    var p = new URLSearchParams(qs);
    var v = (p.get("view") || "").toLowerCase();
 
    // ---- legacy link translation -------------------------------------
    if (v === "advisor") v = "today";            // Dashboard v3.1 and earlier
    if (v === "overdue") {                        // Script Tool daily digest push
      v = "chats";
      out.focus = "overdue";
    }
    var legacyTab = (p.get("tab") || "").toLowerCase();
    if (!v && legacyTab) {
      if (legacyTab === "names") { v = "names"; }
      else if (legacyTab === "settings") {
        // The Script Tool's Settings screen is now More > Backup, sync &
        // export, so a legacy ?tab=settings link has to name the sheet
        // too or it lands on the More menu instead of the screen asked for.
        v = "more";
        out.sheet = "script";
      }
      else { v = "chats"; }
    }
    // ------------------------------------------------------------------
 
    if (VIEW_KEYS.indexOf(v) !== -1) out.view = v;
    out.advisor = p.get("advisor") || null;
    out.sheet = p.get("sheet") || out.sheet || null;
    out.lane = p.get("lane") || null;
    out.q = p.get("q") || null;
    out.convo = p.get("convo") || null;
    out.prospect = p.get("prospect") || null;
    if (!out.focus) out.focus = p.get("focus") || null;
 
    // A bare ?convo= / ?prospect= (no view) is a pre-merge Script Tool
    // link. It names an entity, so it implies its own tab.
    if (!out.view && out.convo) out.view = "chats";
    if (!out.view && out.prospect) out.view = "names";
  } catch (e) {}
  return out;
}
 
function routeToUrl(route) {
  var p = new URLSearchParams();
  ROUTE_KEYS.forEach(function (k) { if (route[k]) p.set(k, route[k]); });
  var s = p.toString();
  return s ? (window.location.pathname + "?" + s) : window.location.pathname;
}

// ======================================================================
// SCRIPT TRACKS
//
// Two chat scripts share one STEPS object. Health step keys carry an "h_"
// prefix, which makes the track derivable from the step alone — nothing
// extra is stored, so a conversation restored onto a second phone comes
// back on the right script without a schema change.
//
// The payout track runs all six stages through to a logged close. The
// health deck stops at the appointment, so its terminal step is a handoff,
// not a close: h_handoff logs nothing, and the advisor records the sale in
// the Dashboard by hand. Nothing in the health track can reach "done".
// ======================================================================
var SCRIPT_PAYOUT = "payout";
var SCRIPT_HEALTH = "health";
 
var SCRIPT_META = {
  payout: {
    key: SCRIPT_PAYOUT,
    label: "Yearly Payout",
    short: "Payout",
    start: "start",
    blurb: "Traditional \u2014 yearly pension from year 6"
  },
  health: {
    key: SCRIPT_HEALTH,
    label: "Critical Health",
    short: "Health",
    start: "h_start",
    blurb: "114 critical illnesses + hospital income"
  }
};
 
var SCRIPT_ORDER = [SCRIPT_PAYOUT, SCRIPT_HEALTH];
 
function scriptOf(stepKey) {
  return (typeof stepKey === "string" && stepKey.indexOf("h_") === 0) ? SCRIPT_HEALTH : SCRIPT_PAYOUT;
}
 
function scriptMeta(key) { return SCRIPT_META[key] || SCRIPT_META[SCRIPT_PAYOUT]; }
function scriptStartStep(key) { return scriptMeta(key).start; }
function otherScript(key) { return key === SCRIPT_HEALTH ? SCRIPT_PAYOUT : SCRIPT_HEALTH; }
 
// The appointment log fires on either track — a health appointment is an
// appointment. The close does not: only the payout track has a "done".
function isApptConfirmStep(stepKey) {
  return stepKey === "appt_confirm" || stepKey === "h_appt_confirm";
}
 
// Steps that exist on both tracks, listed once and inverted below so the
// two directions can never drift apart. "done" is deliberately absent:
// mapping anything onto it would fire a Clients Closed +1 on a switch.
var SCRIPT_PARALLEL = [
  ["start", "h_start"],
  ["seen_opener", "h_seen_opener"],
  ["explain_payout", "h_explain_health"],
  ["has_plan", "h_has_plan"],
  ["pass_sunlife", "h_pass_sunlife"],
  ["other_company", "h_other_company"],
  ["ask_details", "h_ask_details"],
  ["chase_details", "h_chase_details"],
  ["got_details", "h_got_details"],
  ["appt_day", "h_appt_day"],
  ["appt_weekday", "h_appt_weekday"],
  ["appt_weekend", "h_appt_weekend"],
  ["appt_time", "h_appt_time"],
  ["appt_confirm", "h_appt_confirm"],
  ["chase_appt", "h_chase_appt"]
];
 
var SCRIPT_SWITCH_MAP = (function () {
  var map = {};
  SCRIPT_PARALLEL.forEach(function (pair) {
    map[pair[0]] = pair[1];
    map[pair[1]] = pair[0];
  });
  // Payout steps past the appointment have no health parallel. The client's
  // name and birthday are already in hand at that point, so the honest
  // landing is "making the quotation", not back at the opener.
  ["present_intro", "benefit_life", "benefit_disability", "benefit_payout",
   "questions", "chase_present", "forms", "chase_forms",
   "close_bank", "close_payment", "done"].forEach(function (k) {
    map[k] = "h_got_details";
  });
  map.h_handoff = "got_details";
  return map;
})();
 
// Never returns a step on the track it was given, and never returns "done".
function switchTargetStep(stepKey) {
  var target = SCRIPT_SWITCH_MAP[stepKey];
  if (!target || !STEPS[target] || target === "done") {
    return scriptStartStep(otherScript(scriptOf(stepKey)));
  }
  return target;
}
 
// ======================================================================
// EDITABLE SCRIPT (Patch 12)
//
// BASE_STEPS above is what the code ships and is the only thing that
// exists offline, on a cold first load, or if the database is unreachable.
// A published doc is layered over it:
//
//   patches  per-step field overrides for the 42 built-in steps
//   custom   whole new steps, keyed c_foo (payout) or h_c_foo (health)
//
// Two properties matter and are enforced here rather than trusted:
// a patch can only override fields on a step that already exists, and a
// custom step is refused if its key collides with a built-in. Together
// those mean the 42 keys can never be renamed or removed by anything a
// manager publishes — which is what keeps appt_confirm, h_appt_confirm and
// done permanently present, since those three are wired to Appointments
// Set and Clients Closed.
//
// STEPS / FINISHED / STEP_PROGRESS are reassigned, not rebuilt in place,
// so every existing reader picks the new values up on the next render
// without knowing this layer exists.
// ======================================================================
var SCRIPT_DOC_KEY = "br-script-doc";
var CUSTOM_KEY_RE = /^(h_)?c_[a-z0-9_]+$/;
 
function emptyScriptDoc() { return { v: 1, patches: {}, custom: {} }; }
 
function isBuiltInStep(key) {
  return Object.prototype.hasOwnProperty.call(BASE_STEPS, key);
}
 
function resolveSteps(sdoc) {
  var steps = {};
  Object.keys(BASE_STEPS).forEach(function (k) { steps[k] = BASE_STEPS[k]; });
 
  var patches = (sdoc && sdoc.patches) || {};
  Object.keys(patches).forEach(function (k) {
    if (!steps[k]) return;                       // patches never create steps
    var p = patches[k] || {}, base = steps[k];
    steps[k] = {
      stage:   p.stage   != null ? p.stage   : base.stage,
      title:   p.title   != null ? p.title   : base.title,
      note:    p.note    != null ? p.note    : base.note,
      scripts: p.scripts != null ? p.scripts : base.scripts,
      choices: p.choices != null ? p.choices : base.choices,
      edited: true
    };
  });
 
  var custom = (sdoc && sdoc.custom) || {};
  Object.keys(custom).forEach(function (k) {
    if (steps[k]) return;                        // never shadow a built-in
    if (!CUSTOM_KEY_RE.test(k)) return;
    var c = custom[k] || {};
    steps[k] = {
      stage: c.stage || "prospect",
      title: c.title || k,
      note: c.note || "",
      scripts: c.scripts || [],
      choices: c.choices || [],
      custom: true,
      terminal: !!c.terminal
    };
  });
 
  return steps;
}
 
function resolveFinished(steps) {
  var fin = {};
  Object.keys(BASE_FINISHED).forEach(function (k) { fin[k] = BASE_FINISHED[k]; });
  Object.keys(steps).forEach(function (k) {
    if (steps[k].custom && steps[k].terminal) fin[k] = true;
  });
  return fin;
}
 
// A custom step has no shipped progress value. Rather than asking the
// manager to invent a percentage, it inherits from whichever step points
// at it — the furthest along, if several do. Repeated because a custom
// step can point at another custom step.
function resolveProgress(steps) {
  var prog = {};
  Object.keys(BASE_STEP_PROGRESS).forEach(function (k) { prog[k] = BASE_STEP_PROGRESS[k]; });
  for (var pass = 0; pass < 4; pass++) {
    Object.keys(steps).forEach(function (to) {
      if (prog[to] != null) return;
      var best = null;
      Object.keys(steps).forEach(function (from) {
        if (prog[from] == null) return;
        (steps[from].choices || []).forEach(function (ch) {
          if (ch.next === to && (best === null || prog[from] > best)) best = prog[from];
        });
      });
      if (best !== null) prog[to] = best;
    });
  }
  Object.keys(steps).forEach(function (k) { if (prog[k] == null) prog[k] = 0; });
  return prog;
}
 
var STEPS = BASE_STEPS;
var FINISHED = BASE_FINISHED;
var STEP_PROGRESS = BASE_STEP_PROGRESS;
var scriptDocVersion = 0;
var scriptDocCurrent = emptyScriptDoc();
 
function applyScriptDoc(sdoc, version) {
  scriptDocCurrent = sdoc || emptyScriptDoc();
  STEPS = resolveSteps(scriptDocCurrent);
  FINISHED = resolveFinished(STEPS);
  STEP_PROGRESS = resolveProgress(STEPS);
  if (typeof version === "number") scriptDocVersion = version;
}
 
// Applied from cache before the first paint. An advisor opening the app on
// the train sees the script they were published, not the one compiled into
// the file they downloaded three weeks ago.
(function () {
  try {
    var cached = lget(SCRIPT_DOC_KEY, null);
    if (cached && cached.doc) applyScriptDoc(cached.doc, cached.version || 0);
  } catch (e) { /* a corrupt cache must fall back to the built-ins, not crash */ }
})();
 
// ---- validation ------------------------------------------------------
// Mirrors validate_script_doc() in the database and adds the checks that
// need a graph walk. The database copy is the one that cannot be skipped;
// this one exists so the manager sees every problem at once, on the screen
// where they can fix it, before Publish is even tappable.
var SCRIPT_STAGES_ALLOWED = ["approach", "relationship", "prospect", "appointment", "presented", "closing"];
 
function validateScriptDoc(sdoc) {
  var errors = [], warnings = [];
  var steps = resolveSteps(sdoc);
  var patches = (sdoc && sdoc.patches) || {};
  var custom = (sdoc && sdoc.custom) || {};
 
  Object.keys(patches).forEach(function (k) {
    if (!isBuiltInStep(k)) errors.push('"' + k + '" is not a built-in step.');
  });
 
  Object.keys(custom).forEach(function (k) {
    if (!CUSTOM_KEY_RE.test(k)) {
      errors.push('"' + k + '" must be named c_something, or h_c_something on the health track.');
    }
    if (isBuiltInStep(k)) errors.push('"' + k + '" collides with a built-in step.');
    var c = custom[k] || {};
    if (!(c.title || "").trim()) errors.push('"' + k + '" needs a title.');
    if (SCRIPT_STAGES_ALLOWED.indexOf(c.stage) === -1) errors.push('"' + k + '" has an unknown stage.');
    if (!c.terminal && (c.choices || []).length === 0) {
      errors.push('"' + (c.title || k) + '" has no choices, so an advisor would be stuck on it. Add a choice or mark it as an ending.');
    }
  });
 
  Object.keys(steps).forEach(function (k) {
    var st = steps[k];
    var track = scriptOf(k);
    (st.choices || []).forEach(function (ch) {
      if (!(ch.label || "").trim()) errors.push('A choice on "' + st.title + '" has no label.');
      if (!ch.next) { errors.push('A choice on "' + st.title + '" has no destination.'); return; }
      if (ch.next === "home") return;
      if (!steps[ch.next]) { errors.push('"' + st.title + '" points at "' + ch.next + '", which does not exist.'); return; }
      if (scriptOf(ch.next) !== track) {
        errors.push('"' + st.title + '" points at a step on the other script. Use the switch control instead \u2014 a conversation\u2019s track is read from its step.');
      }
    });
    (st.scripts || []).forEach(function (s) {
      (String(s).match(/\{[^}]*\}/g) || []).forEach(function (t) {
        if (t !== "{name}") errors.push('"' + st.title + '" contains ' + t + '. The only placeholder that fills in is {name}.');
      });
    });
  });
 
  // Reachability, per track. An orphan is not fatal to anyone mid-flow, so
  // it is a warning — but it means work that no advisor will ever see.
  SCRIPT_ORDER.forEach(function (track) {
    var seen = {}, stack = [scriptStartStep(track)];
    while (stack.length) {
      var k = stack.pop();
      if (k === "home" || seen[k] || !steps[k]) continue;
      seen[k] = true;
      (steps[k].choices || []).forEach(function (ch) { stack.push(ch.next); });
    }
    Object.keys(steps).forEach(function (k) {
      if (scriptOf(k) !== track || seen[k]) return;
      warnings.push('"' + steps[k].title + '" can\u2019t be reached from the ' + scriptMeta(track).short + ' opener.');
    });
  });
 
  // The two milestone steps must stay reachable or the metric silently
  // stops moving, which is the failure nobody notices for a month.
  [["appt_confirm", "Appointments Set"], ["h_appt_confirm", "Appointments Set (health)"], ["done", "Clients Closed"]]
    .forEach(function (pair) {
      var track = scriptOf(pair[0]);
      var seen = {}, stack = [scriptStartStep(track)];
      while (stack.length) {
        var k = stack.pop();
        if (k === "home" || seen[k] || !steps[k]) continue;
        seen[k] = true;
        (steps[k].choices || []).forEach(function (ch) { stack.push(ch.next); });
      }
      if (!seen[pair[0]]) errors.push('Nothing leads to "' + steps[pair[0]].title + '" any more, so ' + pair[1] + ' would stop being logged.');
    });
 
  return { ok: errors.length === 0, errors: errors, warnings: warnings };
}
 
function scriptDocIsEmpty(sdoc) {
  return Object.keys((sdoc && sdoc.patches) || {}).length === 0
      && Object.keys((sdoc && sdoc.custom) || {}).length === 0;
}
 
function scriptDocsEqual(a, b) {
  try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; }
}
 
function scriptProgress(stepKey) {
  var v = STEP_PROGRESS[stepKey];
  return v == null ? 0 : v;
}
 
function daysSinceMs(ts) { return Math.floor((Date.now() - ts) / 86400000); }
 
function fmtAgo(ts) {
  if (!ts) return "";
  var mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + "h ago";
  var d = Math.floor(hrs / 24);
  if (d === 1) return "yesterday";
  if (d < 7) return d + "d ago";
  var w = Math.floor(d / 7);
  if (d < 30) return w === 1 ? "1 week ago" : w + " weeks ago";
  var mo = Math.floor(d / 30);
  return mo === 1 ? "1 month ago" : mo + " months ago";
}
 
function urgency(convo) {
  if (FINISHED[convo.step]) return "none";
  var d = daysSinceMs(convo.updated);
  if (d >= 7) return "high";
  if (d >= 3) return "medium";
  return "low";
}
 
function urgencyColor(level) {
  if (level === "high") return COLORS.rust;
  if (level === "medium") return "#F0B040";
  return "#8CA5BD";
}
 
function sortConvos(list, mode) {
  return list.slice().sort(function (a, b) {
    var af = FINISHED[a.step] ? 1 : 0, bf = FINISHED[b.step] ? 1 : 0;
    if (af !== bf) return af - bf;                    // finished always last
    if (mode === "stale") return a.updated - b.updated;  // longest untouched first
    return b.updated - a.updated;                     // most recently touched first
  });
}
 
function fill(text, name) {
  var n = (name || "").trim();
  return text.replace(/\{name\}/g, n || "friend");
}
 
function copyText(text, done) {
  function fallback() {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      done(ok);
    } catch (e) { done(false); }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
  } else { fallback(); }
}
 
function convosKey(advisorId) { return "br-convos-" + advisorId; }
 
function syncMetaKey(advisorId) { return "br-sync-meta-" + advisorId; }
 
function rosterSelectColumns() {
  var cols = [ADVISOR_ID_COLUMN, ADVISOR_NAME_COLUMN];
  if (ADVISOR_ACTIVE_COLUMN) cols.push(ADVISOR_ACTIVE_COLUMN);
  if (ADVISOR_APPROVED_COLUMN) cols.push(ADVISOR_APPROVED_COLUMN);

async function enableDigestPush(advisorId) {
  if (!supabaseClient) return { error: "Cloud isn't configured yet." };
  if (!isOneSignalConfigured()) return { error: "Push isn't configured yet." };
  // Deliberately NOT routed through OneSignalDeferred.push() here \u2014 Safari
  // only shows its permission prompt when requestPermission() is called
  // directly within the click's own call stack. Queuing it onto OneSignal's
  // deferred array (fine for init, which needs no user gesture) breaks that
  // chain on Safari specifically: the prompt never appears and the promise
  // just hangs, which is exactly the "stuck on Working\u2026" symptom this fixes.
  // By the time Settings is reachable, initOneSignal() (called at module
  // load) has had many seconds to finish, so window.OneSignal is expected
  // to already be the real SDK object, not just the queue.
  if (!window.OneSignal || !window.OneSignal.Notifications) {
    return { error: "Notifications are still loading \u2014 wait a moment and try again." };
  }
  try {
    var timedOut = { timedOut: true };
    var result = await Promise.race([
      window.OneSignal.Notifications.requestPermission(),
      new Promise(function (resolve) { setTimeout(function () { resolve(timedOut); }, 15000); })
    ]);
    if (result === timedOut) return { error: "No response from the notification prompt \u2014 try again." };
    var subId = window.OneSignal.User.PushSubscription.id || null;
    if (!subId) return { error: "Notifications weren't enabled \u2014 check your browser's permission settings." };
    var res = await supabaseClient.from("advisor_push_subs").upsert({
      advisor_id: advisorId, onesignal_player_id: subId, digest_opt_in: true, updated_at: new Date().toISOString()
    }, { onConflict: "advisor_id" });
    if (res.error) return { error: "Saved locally, but couldn't reach the server \u2014 try again." };
    return { data: true };
  } catch (e) { return { error: "Couldn't enable notifications \u2014 try again." }; }
}

var syncInFlight = {};

  var meta = getSyncMeta(advisorId);
  meta.pendingUpsert = meta.pendingUpsert.filter(function (id) { return id !== convoId; });
  if (meta.pendingDelete.indexOf(convoId) === -1) meta.pendingDelete.push(convoId);

async function runSync(advisorId) {
  if (!advisorId || !supabaseClient) return;
  if (syncInFlight[advisorId]) return;
  if (typeof navigator !== "undefined" && navigator.onLine === false) return;
 
  var meta = getSyncMeta(advisorId);
  if (meta.pendingUpsert.length === 0 && meta.pendingDelete.length === 0) return;
 
  syncInFlight[advisorId] = true;
  try {
    var convos = lget(convosKey(advisorId), []);
    var convoMap = {};
    convos.forEach(function (c) { convoMap[c.id] = c; });
 
    var stillPendingUpsert = [];
    for (var i = 0; i < meta.pendingUpsert.length; i++) {
      var id = meta.pendingUpsert[i];
      var c = convoMap[id];
      if (!c) continue; // deleted locally before it ever synced — nothing left to push
      var ok = await pushUpsert(advisorId, c);
      if (!ok) stillPendingUpsert.push(id);
    }
 
    var stillPendingDelete = [];
    for (var j = 0; j < meta.pendingDelete.length; j++) {
      var did = meta.pendingDelete[j];
      var ok2 = await pushTombstone(advisorId, did);
      if (!ok2) stillPendingDelete.push(did);
    }
 
    var fresh = getSyncMeta(advisorId); // re-read in case something queued more work mid-flight
    fresh.pendingUpsert = stillPendingUpsert.concat(
      fresh.pendingUpsert.filter(function (id) { return meta.pendingUpsert.indexOf(id) === -1; })
    );
    fresh.pendingDelete = stillPendingDelete.concat(
      fresh.pendingDelete.filter(function (id) { return meta.pendingDelete.indexOf(id) === -1; })
    );
    fresh.lastSyncedAt = Date.now();
    fresh.lastSyncStatus = (stillPendingUpsert.length === 0 && stillPendingDelete.length === 0) ? "synced" : "partial";
    setSyncMeta(advisorId, fresh);
  } catch (e) {
    // swallow — background sync failures must never surface as noisy errors
  } finally {
    syncInFlight[advisorId] = false;
  }
}

async function downloadBlob(filename, mime, content) {
  var blob;
  try { blob = new Blob([content], { type: mime }); } catch (e) { return false; }
 
  if (navigator.share && navigator.canShare) {
    try {
      var file = new File([blob], filename, { type: mime });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file] });
        return true;
      }
    } catch (e) {
      // AbortError means the advisor deliberately closed the share sheet —
      // respect that instead of immediately firing a second, unrequested
      // download right after they cancelled the first one.
      if (e && e.name === "AbortError") return false;
      // Any other failure (canShare lied, share() itself broke) falls
      // through to the classic download below.
    }
  }
 
  try {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    return true;
  } catch (e2) {
    return false;
  }
}

// ---------------------------------------------------------------------
// Advisor photos.
//
// Stored as base64 JPEG data URLs in their own table rather than as a
// column on `advisors`, because the roster is fetched with select("*") on
// every app open and for every leaderboard — putting image bytes there
// would drag them into queries that only wanted names and codes.
//
// A phone photo is 3-5MB. Nothing is uploaded raw: every image is
// centre-cropped to a square and re-encoded on a canvas before it goes
// anywhere, which lands around 20KB. The database has a matching size
// constraint, so a client that skipped this step would be rejected rather
// than quietly filling the table.
// ---------------------------------------------------------------------
var AVATARS_TABLE = "advisor_avatars";
var AVATAR_PX = 256;
var AVATAR_MAX_CHARS = 60000;              // must match the CHECK constraint
var AVATAR_QUALITIES = [0.82, 0.7, 0.6, 0.5];
var AVATAR_CACHE_KEY = "br-avatars";
 
// Reads a picked file, centre-crops it square, and re-encodes it small
// enough to store. Steps down the JPEG quality until it fits rather than
// failing on a large photo — a rejection the advisor can't act on ("too
// big" — compared to what?) is worse than a slightly softer image.
function fileToSquareDataUrl(file, size) {
  return new Promise(function (resolve, reject) {
    if (!file) { reject(new Error("No file chosen.")); return; }
    if (!/^image\//.test(file.type || "")) { reject(new Error("That file isn't an image.")); return; }
    var reader = new FileReader();
    reader.onerror = function () { reject(new Error("Couldn't read that file.")); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { reject(new Error("Couldn't open that image.")); };
      img.onload = function () {
        try {
          var side = Math.min(img.width, img.height);
          if (!side) { reject(new Error("That image looks empty.")); return; }
          var canvas = document.createElement("canvas");
          canvas.width = size; canvas.height = size;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img,
            Math.floor((img.width - side) / 2), Math.floor((img.height - side) / 2), side, side,
            0, 0, size, size);
          for (var i = 0; i < AVATAR_QUALITIES.length; i++) {
            var out = canvas.toDataURL("image/jpeg", AVATAR_QUALITIES[i]);
            if (out.length <= AVATAR_MAX_CHARS) { resolve(out); return; }
          }
          reject(new Error("That photo is too detailed to store \u2014 try a simpler one."));
        } catch (e) { reject(new Error("Couldn't process that image.")); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });

      : view === "recruitment" ? "Battle River \u00b7 ACES"
      : (view === "chats" || view === "names") ? "Battle River \u00b7 Sell thru chat"
      : "Battle River \u00b7 Unit";
 
    var header = h(AppHeader, {
      uid: "hdr",
      eyebrow: viewEyebrow,
      title: viewTitle,
      avatarSrc: avatars[myIdentity.id],
      avatarName: myIdentity.name,
      onHome: function () { scrollToTop(true); },
      onSearch: isManager ? function () { navigate({ sheet: "search" }, true); } : null,
      onAccount: function () { navigate({ sheet: "account" }, true); }
    },
      // RULE 7: a refresh that will replace what's on screen announces
      // itself with a live progress bar rather than a frozen page.
      h("div", { className: "mt-3" }, h(ProgressBar, { active: !!teamLoading, label: "Refreshing team data" }))
    );
 
    mainBody = h("div", { className: "max-w-md mx-auto has-bottom-nav" },
      header,
      // ---- Script half. Always mounted, hidden when another tab is on
      // screen, so background sync keeps running and Rule 12's drafts and
      // Rule 8's scroll offsets survive a tab switch.
      h("div", { style: { display: scriptVisible ? "block" : "none" } },
        h(ScriptSection, {
          advisor: myIdentity,
          screen: scriptScreen,
          activeConvoId: route.convo,
          highlightProspect: route.prospect,
          focus: route.focus,
          quickAddOpen: openSheet === "quickadd",
          onAdvisorPatch: function (next) { setMyIdentity(next); lset("my-identity", next); lset("br-advisor", next); },
          onSetScreen: function (s) {
            navigate({ view: s === "names" ? "names" : "chats", convo: null, sheet: null }, true);
          },
          onOpenConvo: function (id) {
            if (id) navigate({ view: "chats", convo: id, sheet: null }, true);
            else if (route.convo) navigate({ convo: null }, false);
          },
          onSetHighlight: function (id) { navigate({ prospect: id || null }, false); },
          onClearFocus: function () { navigate({ focus: null }, false); },
          onOverdueCount: setOverdueCount,
          digest: {
            open: digestOpen, referralUpdates: referralUpdates,
            overdueCount: overdueCount, onDismiss: dismissDigest
          },
          onBack: goBackOne,
          onOpenQuickAdd: function () { navigate({ sheet: "quickadd" }, true); },
          onCloseQuickAdd: closeSheet,
          onOpenNames: function () { navigate({ view: "names", convo: null, sheet: null }, true); },
          onOpenScriptSettings: function () { navigate({ view: "more", sheet: "script", convo: null }, true); },
          onOpenAccount: function () { navigate({ sheet: "account" }, true); },
          onShowTour: function () { navigate({ view: "more", sheet: "tour" }, true); },
          onTourDone: function () {
            setTourSeen(true);
            // Only the deliberate More → tour route pushed a history entry;
            // the first-run auto-tour did not, so popping there would walk
            // the advisor out of the app instead of into their chat list.
            if (route.sheet === "tour") goBackOne();
          },
          onChangeIdentity: function () { navigate({ sheet: null }, false); setSwitching(true); },
          onAddAdvisor: function () { navigate({ view: "more", sheet: "script" }, true); }
        })
      ),
 
      view === "more" && !route.sheet && h(MoreView, {
        advisor: myIdentity, isManager: isManager,
        onGo: function (v) { navigate({ view: v, advisor: null, sheet: null }, true); },
        onGoSheet: function (s) { navigate({ view: "more", sheet: s }, true); },
        onManagerTools: function () { setShowManagerGate(true); },
        onAccount: function () { navigate({ sheet: "account" }, true); },
        overdueCount: overdueCount
      }),
 
      isAdvisorTab && h(AdvisorView, {
        section: view,
        date: today, entry: myTodayEntry, pulse: pulse, targets: targets, saveError: saveError,
        onBump: bump, onToggleSocial: function () { upsertField({ social: !myTodayEntry.social }); }, onNote: function (note) { upsertField({ note: note }); },
        mySubmissions: mySubmissions,
        onAddSubmission: function (amount, serial, clientName) { return addSubmission(amount, serial, clientName, myCode); },
        monthSubmittedMine: monthSubmitted[myCode] || 0, monthSettledMine: monthSettled[myCode] || 0,
        todayTotals: todayTotals, socialToday: socialToday,
        teamCount: new Set(todayRows.map(function (e) { return e.advisor_code; })).size,
        leaderboard: leaderboard, trendData: trendData, funnelData: funnelData, myCode: myCode, loading: teamLoading,
        onRefresh: function () { loadTeamData(); refreshMyEntries(myCode); },
        myWeekDayLabels: myWeekDayLabels, monthBoards: monthBoards, myReferrals: myReferrals,
        currentStreak: currentStreak, bestStreak: bestStreak, onAddReferral: function (name) { return addReferral(name, myCode); },
        myReceivable: myReceivable, referralUpdates: referralUpdates, onAckReferralUpdates: ackReferralUpdates,
        lastSyncedAt: lastSyncedAt,
        awardProgress: awardProgress,
        hasTeamData: teamEntries.length > 0,
        avatarByCode: avatarByCode,
        myEntriesByDate: myEntries, myRosterRow: myRosterRow, unitMedianPct: unitMedianPct
      }),
      view === "manager" && isManager && h(ManagerView, {
        date: today, roster: roster, activeRoster: activeRoster, teamEntries: teamEntries, loading: teamLoading, onRefresh: loadTeamData,
        missingToday: missingToday, loggedTodayCount: loggedTodayCount, targets: targets, onSaveTargets: saveTargets,
        todayRows: todayRows, monthBoards: monthBoards, referrals: referrals, onUpdateReferral: updateReferral,
        onDeleteReferral: deleteReferral,
        submissions: submissions, onSetSubmissionSettled: setSubmissionSettled,
        onDeleteSubmission: deleteSubmission,
        onSetAdvisorActive: setAdvisorActive,
        pendingRoster: pendingRoster, onAddAdvisor: managerCreateAdvisor,
        onApproveAdvisor: approveAdvisor, onRejectAdvisor: rejectAdvisor,
        myCode: myCode,
        awardProgress: awardProgress,
        coachingStats: coachingStats,
        avatars: avatars, onSaveAvatar: saveAvatar,
        route: route, navigate: navigate, closeSheet: closeSheet,
        onAddManagerSubmission: function(advisorCode, serial, clientName, amount, nbAc, submittedDate, settledDate) {
          return addManagerSubmission(advisorCode, serial, clientName, amount, nbAc, submittedDate, settledDate);
        }
      }),
      view === "scriptedit" && isManager && h(ScriptEditorView, {
        actorId: myIdentity && myIdentity.id,
        requirePin: requireManagerPin,
        onPublished: function () { setScriptTick(function (n) { return n + 1; }); }
      }),
      view === "recruitment" && isManager && h(RecruitmentView, {
        readOnly: true, today: today, scorecard: recruitment.scorecard, forumEvents: recruitment.forumEvents,
        loading: recruitment.loading, onRefresh: loadRecruitmentData
      }),
      h("div", { style: { color: COLORS.slate }, className: "text-center text-[10px] font-mono mt-8 px-5 leading-relaxed" },
        "Battle River Unit \u00b7 " + APP_NAME + " " + APP_VERSION,
        h("br", null),
        "Built by Matthew Isaiah Masindo")
    );
  }
 
  return h("div", { style: { background: COLORS.parchment, minHeight: "100vh" } },
    pendingSelf
      ? h(WaitingApprovalScreen, {
          pending: pendingSelf,
          onCheck: checkMyApprovalStatus,
          onVerifyPin: verifyAdvisorPin,
          onDone: completePendingClaim,
          onCancel: cancelPendingSelf
        })
      : (showOnboarding
          ? h(Onboarding, {
              roster: activeRoster, onChoose: chooseAdvisor, onCreate: selfRegisterAdvisor, onVerifyPin: verifyAdvisorPin,
              cancelable: !!myIdentity, onCancel: function () { setSwitching(false); },
              onEnterRecruitment: function () { setIsRecruitment(true); lset("is-recruitment", true); setSwitching(false); }
            })
          : mainBody),
 
    !showOnboarding && !pendingSelf && h(BottomNav, { tabs: navTabs, active: view, onSelect: onTabPress }),
 
    !showOnboarding && !pendingSelf && openSheet === "account" && h(AccountSheet, {
      advisor: myIdentity, isManager: isManager, isRecruitment: isRecruitment,
      avatarSrc: avatars[myIdentity.id],
      onSaveAvatar: function (url) { return saveAvatar(myIdentity.id, url); },
      onClose: closeSheet,
      onSwitch: function () { navigate({ sheet: null }, false); setSwitching(true); },
      onManagerTools: function () { navigate({ sheet: null }, false); setShowManagerGate(true); },
      onExport: isManager ? function () { navigate({ view: "manager", sheet: "export" }, true); } : null,
      lastSyncedAt: lastSyncedAt
    }),
 
    !showOnboarding && !pendingSelf && openSheet === "search" && h(SearchSheet, {
      roster: roster, referrals: referrals, initialQuery: route.q || "",
      onClose: closeSheet,
      onPickAdvisor: function (code) { navigate({ view: "manager", advisor: code, sheet: null, q: null }, true); },
      onPickCandidate: function (name) { navigate({ view: "manager", sheet: null, q: name }, true); }
    }),
 
    showManagerGate && h(ManagerGate, { flagged: amFlaggedManager, onSubmit: unlockManager, onClose: cancelManagerGate })
  );
}
 
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
